<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PC Remote">
  <title>Wayland Remote Desktop</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <!-- Main Display Canvas -->
    <div id="viewport">
      <canvas id="display-canvas"></canvas>
      <div id="touch-indicator" class="touch-indicator"></div>
    </div>

    <!-- Top Floating Toolbar -->
    <header id="top-toolbar">
      <div class="toolbar-left">
        <div id="status-pill" class="status-pill connecting">
          <span class="status-dot"></span>
          <span id="status-text">Connecting...</span>
        </div>
        <span id="stats-text" class="stats-text">0 FPS • 0ms</span>
      </div>

      <div class="toolbar-right">
        <button id="btn-mode" class="tool-btn" title="Toggle Touch/Trackpad Mode">
          <span id="mode-icon">👆</span>
          <span id="mode-label">Direct</span>
        </button>
        <button id="btn-kbd" class="tool-btn" title="Toggle Keyboard">
          <span>⌨️</span>
        </button>
        <button id="btn-settings" class="tool-btn" title="Change Password / Settings">
          <span>⚙️</span>
        </button>
        <button id="btn-fullscreen" class="tool-btn" title="Fullscreen">
          <span>⛶</span>
        </button>
      </div>
    </header>

    <!-- Floating Special Keys & Keyboard Bar -->
    <div id="keyboard-drawer" class="keyboard-drawer hidden">
      <!-- Special Keys Row -->
      <div class="keys-scroll-container">
        <div class="keys-row">
          <button id="btn-focus-soft-kbd" class="key-btn special-btn" title="Open Phone Soft Keyboard">📱 Keyboard</button>
          <button class="key-btn" data-key="Escape">Esc</button>
          <button class="key-btn" data-key="Tab">Tab</button>
          <button class="key-btn mod-key" id="mod-ctrl" data-key="Control_L">Ctrl</button>
          <button class="key-btn mod-key" id="mod-alt" data-key="Alt_L">Alt</button>
          <button class="key-btn mod-key" id="mod-super" data-key="Super_L">Super</button>
          <button class="key-btn shortcut-btn" id="btn-ctrl-c" title="Copy / Cancel">Ctrl+C</button>
          <button class="key-btn shortcut-btn" id="btn-ctrl-v" title="Paste">Ctrl+V</button>
          <button class="key-btn shortcut-btn" id="btn-ctrl-z" title="Undo">Ctrl+Z</button>
          <button class="key-btn" data-key="Space">␣ Space</button>
          <button class="key-btn" data-key="Return">Enter</button>
          <button class="key-btn" data-key="BackSpace">⌫</button>
          <button class="key-btn" data-key="Delete">Del</button>
          <button class="key-btn" data-key="Left">←</button>
          <button class="key-btn" data-key="Up">↑</button>
          <button class="key-btn" data-key="Down">↓</button>
          <button class="key-btn" data-key="Right">→</button>
        </div>
      </div>

      <!-- Quick Text Input Row for typing/pasting -->
      <form id="quick-text-form" class="text-input-row" onsubmit="return false;">
        <input type="text" id="quick-text-input" placeholder="Type command or text to laptop..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="btn-send-text" type="submit" class="action-btn">Send</button>
        <button id="btn-send-enter" type="button" class="action-btn secondary-btn" title="Send text and press Enter">Send ↵</button>
      </form>
    </div>

    <!-- Hidden input to invoke native phone virtual keyboard -->
    <input type="text" id="hidden-key-input" class="hidden-key-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">

    <!-- Auth Login Modal Dialog -->
    <div id="auth-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="login-brand">
          <img src="/icon.svg" width="48" height="48" alt="Logo" class="login-icon">
          <h3>Sign In to PC</h3>
          <p>Enter your credentials to control this laptop</p>
        </div>

        <form id="login-form" autocomplete="on">
          <div class="input-group">
            <label for="username-input">Username</label>
            <input type="text" id="username-input" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
          </div>

          <div class="input-group">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" name="password" placeholder="Password" autocomplete="current-password" required>
          </div>

          <div id="auth-error" class="error-msg hidden"></div>

          <button type="submit" id="btn-auth-submit" class="primary-btn">Sign In</button>
        </form>
      </div>
    </div>

    <!-- Settings / Change Password Modal Dialog -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="login-brand">
          <img src="/icon.svg" width="48" height="48" alt="Logo" class="login-icon">
          <h3>Change Password</h3>
          <p>Update credentials for remote access</p>
        </div>

        <form id="settings-form">
          <div class="input-group">
            <label for="settings-username-input">Username</label>
            <input type="text" id="settings-username-input" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
          </div>

          <div class="input-group">
            <label for="settings-new-pw-input">New Password</label>
            <input type="password" id="settings-new-pw-input" name="new-password" placeholder="New Password" autocomplete="new-password" required>
          </div>

          <div class="input-group">
            <label for="settings-confirm-pw-input">Confirm Password</label>
            <input type="password" id="settings-confirm-pw-input" name="confirm-password" placeholder="Confirm Password" autocomplete="new-password" required>
          </div>

          <div id="settings-error" class="error-msg hidden"></div>
          <div id="settings-success" class="success-msg hidden"></div>

          <div class="form-buttons">
            <button type="button" id="btn-settings-cancel" class="cancel-btn">Cancel</button>
            <button type="submit" id="btn-settings-save" class="primary-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
