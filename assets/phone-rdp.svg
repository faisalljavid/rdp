<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e1e5eb"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded App Square -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  
  <!-- Laptop Display Silhouette -->
  <rect x="24" y="28" width="80" height="50" rx="6" fill="#1e2229" stroke="#ffffff" stroke-width="3"/>
  <rect x="29" y="33" width="70" height="40" rx="3" fill="#303846"/>
  <!-- Laptop Base -->
  <path d="M16 80 L112 80 L104 86 L24 86 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Smartphone in Foreground -->
  <g transform="translate(68, 48)">
    <rect x="0" y="0" width="38" height="64" rx="8" fill="#181c24" stroke="#ffffff" stroke-width="3"/>
    <rect x="3" y="6" width="32" height="48" rx="4" fill="url(#phone)"/>
    <!-- Screen lines / remote signal -->
    <circle cx="19" cy="58" r="2.5" fill="#ffffff"/>
    <path d="M9 22 L29 22 M9 30 L25 30 M9 38 L20 38" stroke="#3584e4" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
